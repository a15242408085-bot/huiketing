ty":"门口有一级约 12 厘米台阶，店内通道较窄。","payment":"移动支付、现金均可。","services":{"wifi":null,"power":null,"luggage":null},"faqs":[{"id":"tea-alone","question":"一个人来可以坐哪里？","answer":"吧台有 6 个单人位，工作日 14:00–17:00 最安静，不需要拼桌。","source":"店主提供"},{"id":"tea-order","question":"第一次来怎么点？","answer":"建议云溪烘青一杯加茶点三拼，共 40 元；不喝茶可选桂花米浆。","source":"店主提供"},{"id":"tea-duration","question":"一杯茶能坐多久？","answer":"通常可以坐约 90 分钟；周末和客流高峰时请以现场安排为准。","source":"店主提供"}],"recommendations":[{"shopId":"ayuan-noodles","reason":"如果还没吃午饭，阿沅面馆的三款面更合适；13:30 前到。","context":"适合想吃热食、预算 30 元以内的人。","source":"店主提供"},{"shopId":"nanzha-bamboo","reason":"喝完茶可以慢慢走到南栅看竹编，店主阿岚自己买竹篮也去那里。","context":"适合不赶时间、对老手艺好奇的人。","source":"店主提供"}],"testimonials":[{"id":"tea-review-01","author":"小穗","context":"第一次独自来 · 工作日下午","quote":"我原本在门口犹豫，知道吧台能一个人坐、点一杯茶也不会被催，才敢进去。","changedAction":"选择吧台就座，停留 70 分钟。","simulated":true,"sourceLabel":"体验回声 · 演示预置"},{"id":"tea-review-02","author":"木木","context":"雨天 · 只想坐一会儿","quote":"到店卡把“先找座、再去吧台点单”写清楚了，进门没有站在中间四处找店员。","changedAction":"按顺序点单，没有反复询问。","simulated":true,"sourceLabel":"体验回声 · 演示预置"},{"id":"tea-review-03","author":"阿屿","context":"周末下午 · 一个人","quote":"体验回声说周末三点后会满，我改成了上午去，确实安静很多。","changedAction":"调整到上午 11 点到店。","simulated":true,"sourceLabel":"体验回声 · 演示预置"}],"accent":"tea","motif":"桥与水纹","lastUpdated":"2026-11-05","regionId":"jiangnan","regionName":"江南水乡","townId":"yunxi","townName":"云溪镇","knowledgeBase":[{"id":"tea-kb-01","category":"位置与到达","question":"从桥西街怎么找到茶寮？","answer":"沿桥西街走到石拱桥西侧，看到第三间木门和一块旧茶匾就是；门口有一级约 12 厘米台阶。"},{"id":"tea-kb-02","category":"营业与高峰","question":"周一开门吗？","answer":"通常周一休息；节假日安排不固定，需要店主当天确认。"},{"id":"tea-kb-03","category":"独行体验","question":"一个人最多能坐多久？","answer":"点一杯茶通常可以坐约 90 分钟；周末和客流高峰时以现场安排为准。"},{"id":"tea-kb-04","category":"点单与菜单","question":"云溪烘青可以续水吗？","answer":"可以免费续一次热水，不额外收费。"},{"id":"tea-kb-05","category":"点单与菜单","question":"茶点三拼里面有什么？","answer":"云片糕、烘豆和当季果干；具体果干随季节变化。"},{"id":"tea-kb-06","category":"点单与菜单","question":"店里除了茶还有能吃饱的吗？","answer":"只有午市到 14:00 的一碗笋干素面；下午主要是茶点，不以正餐为主。"},{"id":"tea-kb-07","category":"座位与空间","question":"一个人能坐靠窗位吗？","answer":"可以。靠窗有两张小桌，一人也可以坐；高峰时不能替同伴占座。"},{"id":"tea-kb-08","category":"座位与空间","question":"六个人能坐一起吗？","answer":"店内空间有限，最多适合六人分散坐；超过六人需要提前问店主当天是否方便。"},{"id":"tea-kb-09","category":"设施与便利","question":"店里有手机支架吗？","answer":"没有公用手机支架，也不外借私人物品；可以正常看手机，但视频通话请到门外。"},{"id":"tea-kb-10","category":"设施与便利","question":"店里有洗手间吗？","answer":"店内没有顾客洗手间；最近的公共洗手间在桥东游客服务点旁，步行约 3 分钟。"},{"id":"tea-kb-11","category":"礼仪与摄影","question":"可以拍照吗？","answer":"可以拍茶、店面和空座，但不要拍正在休息的客人，也不要架设影响通道的器材。"},{"id":"tea-kb-12","category":"礼仪与摄影","question":"可以在这里打电话或开视频吗？","answer":"短时间语音可以轻声说；长时间电话或视频通话请到门外，吧台是安静位。"},{"id":"tea-kb-13","category":"支付与打包","question":"茶点可以打包吗？","answer":"云片糕和果干可以简单打包；热茶不提供外带杯，桥上风大也不建议端着走。"},{"id":"tea-kb-14","category":"支付与打包","question":"可以分开付款吗？","answer":"可以移动支付和现金；多人分开付款需要在点单时提前说明。"},{"id":"tea-kb-15","category":"天气与穿着","question":"下雨天店里会很挤吗？","answer":"雨天傍晚更容易满座，工作日下午相对安静；石板路湿滑，进门前请在门口垫子上停一下。"},{"id":"tea-kb-16","category":"亲子与无障碍","question":"带孩子或婴儿车方便吗？","answer":"没有儿童椅；门口有台阶、通道较窄，婴儿车不适合推进店内。"},{"id":"tea-kb-17","category":"亲子与无障碍","question":"轮椅能进入吗？","answer":"门口一级约 12 厘米台阶，店内通道较窄；轮椅通行需要现场协助，不能保证顺畅通达。"},{"id":"tea-kb-18","category":"边界与安全","question":"可以请店主推荐附近所有值得去的地方吗？","answer":"店主只提供自己愿意推荐的两家店，不评价全城景点，也不对其他店的营业与品质作保证。"},{"id":"tea-kb-19","category":"边界与安全","question":"东西落在店里怎么办？","answer":"可以联系店主描述物品和时间；小店不承诺保管贵重物品，贵重物品请随身带走。"},{"id":"tea-kb-20","category":"点单与菜单","question":"有低糖或不含坚果的茶点吗？","answer":"烘豆和部分果干可能含坚果，云片糕偏甜；具体当天配料必须现场再向店主确认。"}],"knowledgeSummary":{"total":20,"categories":[{"category":"位置与到达","count":1},{"category":"营业与高峰","count":1},{"category":"独行体验","count":1},{"category":"点单与菜单","count":4},{"category":"座位与空间","count":2},{"category":"设施与便利","count":2},{"category":"礼仪与摄影","count":2},{"category":"支付与打包","count":2},{"category":"天气与穿着","count":1},{"category":"亲子与无障碍","count":2},{"category":"边界与安全","count":2}]}},{"id":"ayuan-noodles","number":"02","name":"阿沅面馆","englishName":"AYUAN NOODLES","category":"笋干面 · 家常小馆","stamp":"阿沅","tagline":"只做三碗面，卖完收门。","shortDescription":"河埠头边开了十六年的面馆。午市最忙，但窗边留了六个吃面不用拼桌的小位。","owner":{"name":"阿沅","role":"店主","since":"2010 年","voice":"爽快直接，会提醒你面要趁热吃。"},"address":"云溪镇河埠头 5 号，老邮局斜对面","area":"河埠头","hours":{"display":"周三至周一 06:30–13:30","closed":"周二休；卖完提前收门","soloFriendly":"10:30 前和 12:50 后更容易找到单人位","busy":"周末 11:20–12:30 排队最明显","note":"只做早市和午市，不供应晚餐"},"story":"阿沅每天五点半熬笋干汤底。菜单十几年没有扩成一大张，只留雪菜肉丝、笋干肉丝和酱鸭三碗。她说面馆不是让人研究选择的地方，饿的时候，吃一碗就对了。","storyQuote":"“三碗够了。汤熬得对，客人会自己回来。”","products":[{"name":"笋干肉丝面","price":22,"unit":"碗","note":"店里的第一碗，汤底偏鲜。","signature":true},{"name":"雪菜肉丝面","price":20,"unit":"碗","note":"口味更清爽。"},{"name":"酱鸭面","price":28,"unit":"碗","note":"偏甜咸，每天数量有限。"},{"name":"加荷包蛋","price":3,"unit":"个","note":"可以选择全熟。"}],"signatureChoice":{"soloOrder":"小份笋干肉丝面 + 荷包蛋","budget":25,"reason":"能吃到招牌汤底，又不会因为分量太大吃得太赶。","alternative":"想清淡一点可换成小份雪菜肉丝面。"},"solo":{"counterSeats":6,"seating":"进门左边沿窗有六个单人小位，不用面对面拼桌。","bestTime":"工作日 10:30 前或 12:50 后","comfortNote":"先看黑板点面，前台付款后会叫号，不必一直站着等。","avoid":"周末 11:20–12:30 排队最明显。"},"ordering":"进门先看墙上的黑板，到前台报面名并付款，领号码牌后等叫号。","etiquette":["不要替别人占座；人多时一人只能占一个位。","需要少盐或少辣要在点单时说明。","面趁热吃，不建议打包隔夜。"],"commonMisunderstandings":[{"claim":"是不是有很多浇头可以自由搭配？","correction":"不是。只有三款面，可以加荷包蛋，不做自助浇头。"},{"claim":"晚上还开吗？","correction":"不供应晚餐，通常 13:30 前收门，卖完会提前结束。"},{"claim":"小份是不是只少面，不保证配料？","correction":"小份仍保留同样的招牌配料，只是面量减少。"}],"ownerQuestions":["汤底为什么要从五点半开始熬？","这三碗面里，本地人最常点哪一碗？","为什么店里只留三款面？"],"ownerWillNotAnswer":["不承诺当天卖完后的补货时间。","不提供外卖配送范围。","不评价其他面馆。"],"petPolicy":"不接待宠物入内，门外可短暂等位。","accessibility":"门口平地可进入，内部桌距较紧。","payment":"移动支付、现金均可。","services":{"wifi":null,"power":null,"luggage":null},"faqs":[{"id":"noodle-alone","question":"一个人来坐哪里？","answer":"沿窗有 6 个单人小位，工作日 10:30 前或 12:50 后更容易找到。","source":"店主提供"},{"id":"noodle-order","question":"第一次来点什么？","answer":"小份笋干肉丝面加荷包蛋，共 25 元；想清淡可选雪菜肉丝面。","source":"店主提供"},{"id":"noodle-time","question":"营业到几点？","answer":"通常 06:30–13:30，周二休；卖完会提前收门，不供应晚餐。","source":"店主提供"}],"recommendations":[{"shopId":"qiaoxi-tea","reason":"吃完面沿河走到桥西茶寮约 6 分钟，下午可以坐一歇。","context":"适合午饭后不想立刻赶路的人。","source":"店主提供"},{"shopId":"nanzha-bamboo","reason":"如果对老手艺感兴趣，南栅竹编所下午人少，可以看师傅修竹篮。","context":"适合愿意慢慢看、不赶时间的人。","source":"店主提供"}],"testimonials":[{"id":"noodle-review-01","author":"简宁","context":"第一次来 · 一个人吃午饭","quote":"最有用的是告诉我有小份，而且窗边有单人位。原本怕点多了吃不完。","changedAction":"点了小份笋干面加蛋。","simulated":true,"sourceLabel":"体验回声 · 演示预置"},{"id":"noodle-review-02","author":"洛洛","context":"周末中午 · 赶车","quote":"它直接说周末十一点半会排很久，我改在十点四十到，吃完刚好赶车。","changedAction":"提前一小时到店。","simulated":true,"sourceLabel":"体验回声 · 演示预置"}],"accent":"noodle","motif":"面汤涟漪","lastUpdated":"2026-11-05","regionId":"jiangnan","regionName":"江南水乡","townId":"yunxi","townName":"云溪镇","knowledgeBase":[{"id":"noodle-kb-01","category":"位置与到达","question":"从老邮局怎么走？","answer":"老邮局斜对面就是面馆，门口挂一块黑底白字的小木牌；门口平地可进入。"},{"id":"noodle-kb-02","category":"营业与高峰","question":"周二开门吗？","answer":"通常周二休息；面卖完也会提前收门，不供应晚餐。"},{"id":"noodle-kb-03","category":"营业与高峰","question":"中午几点排队最明显？","answer":"周末 11:20–12:30 最挤；工作日 10:30 前或 12:50 后更容易找到一个人坐的位子。"},{"id":"noodle-kb-04","category":"点单与菜单","question":"小份和大份差多少？","answer":"小份主要减少面量，招牌配料仍保留；是一人吃一碗比较稳的选择。"},{"id":"noodle-kb-05","category":"点单与菜单","question":"哪一碗最适合第一次来？","answer":"第一次建议小份笋干肉丝面；这是店里最久的招牌，再按需要加一个荷包蛋。"},{"id":"noodle-kb-06","category":"点单与菜单","question":"可以少盐或少辣吗？","answer":"可以少盐；辣油通常单独放，可在点单时说明。"},{"id":"noodle-kb-07","category":"点单与菜单","question":"有严格素食吗？","answer":"笋干素面配料可为素，但汤底是否完全不含动物成分必须在现场向店主确认，不建议仅凭菜单判断。"},{"id":"noodle-kb-08","category":"点单与菜单","question":"汤底里有花生或坚果吗？","answer":"基础面不主动放花生，但无法保证厨房完全没有交叉接触；严重过敏必须现场向店主确认。"},{"id":"noodle-kb-09","category":"座位与空间","question":"一个人会需要拼桌吗？","answer":"沿窗有六个单人小位，通常不需要拼桌；高峰时一人只能占一个座位。"},{"id":"noodle-kb-10","category":"座位与空间","question":"可以带孩子吗？","answer":"有儿童椅；店内桌距较紧，热汤上桌时请让孩子坐稳。"},{"id":"noodle-kb-11","category":"设施与便利","question":"店里有洗手间吗？","answer":"店内没有顾客洗手间；最近的公共洗手间在河埠头北侧，步行约 2 分钟。"},{"id":"noodle-kb-12","category":"设施与便利","question":"可以寄存行李箱吗？","answer":"店里不留寄存行李，建议先放到镇口游客服务点，避免占用窄通道。"},{"id":"noodle-kb-13","category":"礼仪与摄影","question":"可以拍师傅煮面吗？","answer":"可以拍厨房外围的工作动作，但不要越过前台，也不要拍到其他正在吃饭的客人。"},{"id":"noodle-kb-14","category":"支付与打包","question":"可以打包带走吗？","answer":"可以打包，但面容易坨，店主建议到店吃；打包不提供保温承诺。"},{"id":"noodle-kb-15","category":"支付与打包","question":"需要先付款吗？","answer":"是，前台报面名后先付款，领号码牌再等叫号。"},{"id":"noodle-kb-16","category":"天气与穿着","question":"雨天排队怎么办？","answer":"店门口没有宽敞等候区，雨天排队会更拥挤；建议避开 11:20–12:30 或改吃早一点。"},{"id":"noodle-kb-17","category":"亲子与无障碍","question":"婴儿车能推进去吗？","answer":"门口平地可进入，但内部桌距较紧；折叠婴儿车需要先问店员放在哪里不影响通道。"},{"id":"noodle-kb-18","category":"边界与安全","question":"可以承诺预留窗边位吗？","answer":"不提供座位预订，也不能承诺留窗边位；到店自行找座。"},{"id":"noodle-kb-19","category":"营业与高峰","question":"卖完大概几点？","answer":"没有固定售完时间，通常 13:30 前结束；酱鸭面数量最少，晚到更需要现场确认。"},{"id":"noodle-kb-20","category":"设施与便利","question":"有插座可以充电吗？","answer":"墙面靠窗有一个公共插座，但不保证一直可用；面馆以吃饭为主，不建议长时间占位充电。"}],"knowledgeSummary":{"total":20,"categories":[{"category":"位置与到达","count":1},{"category":"营业与高峰","count":3},{"category":"点单与菜单","count":5},{"category":"座位与空间","count":2},{"category":"设施与便利","count":3},{"category":"礼仪与摄影","count":1},{"category":"支付与打包","count":2},{"category":"天气与穿着","count":1},{"category":"亲子与无障碍","count":1},{"category":"边界与安全","count":1}]}},{"id":"nanzha-bamboo","number":"03","name":"南栅竹编所","englishName":"NANZHA BAMBOO ATELIER","category":"竹编 · 修补 · 手作","stamp":"南栅","tagline":"先看手怎么动，再决定带什么走。","shortDescription":"父女俩守着的竹编作坊。不是展馆，工作台上每天都真的有人在修篮子。","owner":{"name":"周守义与周禾","role":"父女 · 手艺人","since":"周守义做竹编四十余年","voice":"父亲讲工序，女儿讲使用和保养。"},"address":"云溪镇南栅巷 9 号，白墙院门内","area":"南栅巷","hours":{"display":"周三至周日 09:30–17:00","closed":"周一、周二整理材料，不接待参观","soloFriendly":"工作日 10:00–11:30 最从容","busy":"周末偶尔有学校手作团，声音会更热闹","note":"最后入内时间通常为 16:30"},"story":"周守义不只卖新竹篮，也修镇上人用了很多年的旧篮。女儿周禾把每一件器物适合装什么写在小纸签上。这里没有“非遗表演”，只有工作台、竹丝和做到一半的手。","storyQuote":"“篮子不是摆着看的，手一提，才知道顺不顺。”","products":[{"name":"竹编杯垫","price":18,"unit":"片","note":"适合作为轻便小礼物。","s
